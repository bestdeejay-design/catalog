    <meta name="twitter:description" content="Демо-версия проекта Каталог заведений. Каталог заведений России с поиском, фильтрацией, картой. Разработка AXIIOM.">

</head>
<body>
    <div id="app">
        <!-- Header -->
        <app-header
            :view="view"
            :global-search-term="globalSearchTerm"
            :resolved-theme="resolvedTheme"
            @go-home="goHome"
            @go-categories="goCategories"
            @toggle-theme="toggleTheme"
            @update:global-search-term="globalSearchTerm = $event"
            @global-search="handleGlobalSearch"
        ></app-header>

        <!-- Shell -->
        <main class="app-shell">
            <!-- Cities -->
            <transition name="fade">
                <cities-view
                    v-if="view === 'cities'"
                    :cities="sortedCities"
                    :loading="loading"
                    @select-city="selectCity"
                ></cities-view>
            </transition>

            <!-- Categories -->
            <transition name="fade">
                <categories-view
                    v-if="view === 'categories'"
                    :categories="categories"
                    @select-category="selectCategory"
                ></categories-view>
            </transition>

            <!-- Establishments -->
            <transition name="fade">
                <establishments-view
                    v-if="view === 'establishments'"
                    :establishments="filteredEstablishments"
                    :categories="categories"
                    :city="currentCity"
                    :category="currentCategory"
                    :loading="loading"
                    :search-loading="searchLoading"
                    :search-query="searchQuery"
                    :category-filter="categoryFilter"
                    :available-categories="availableCategories"
                    @select-establishment="selectEstablishment"
                    @update:search-query="searchQuery = $event"
                    @update:category-filter="categoryFilter = $event"
                ></establishments-view>
            </transition>

            <!-- Detail -->
            <transition name="fade">
                <establishment-detail
                    v-if="view === 'detail' && currentEstablishment"
                    :establishment="currentEstablishment"
                    :categories="categories"
                    :images="currentImages"
                    :menu="currentMenu"
                    :features="currentFeatures"
                    :socials="currentSocials"
                    :hours="currentHours"
                    :category-name="currentCategoryName"
                    :open-badge="currentOpenBadge"
                    :gallery-index="galleryIndex"
                    :lightbox-open="lightboxOpen"
                    :lightbox-image="lightboxImage"
                    @go-back="goBack"
                    @prev-image="prevImage"
                    @next-image="nextImage"
                    @set-image="setImage"
                    @open-lightbox="openLightbox"
                    @close-lightbox="closeLightbox"
                ></establishment-detail>
            </transition>
        </main>

        <!-- Toast -->
        <transition name="toast">
            <div v-if="toast" class="toast">{{ toast }}</div>
        </transition>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="app.js"></script>
